[package]
name = "auv"
version = "0.1.0"
edition = "2024"
description = "AUV is a media player written in Rust.(fltk, cpal, ffmpeg-next)"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
env_logger = "0.11.11"
ffmpeg-next = "9.0.0"
fltk = { version = "1.5.23", features = ["enable-glwindow", "use-wayland"] }
gl = "0.14.0"
log = "0.4.34"
png = "0.18.1"
ringbuf = "0.5.2"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
