[package]
name = "auv"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "AUV is a media player written in Rust.(fltk, cpal, ffmpeg-next)"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
env_logger = "0.11.11"
ffmpeg-next = "9.0.0"
fltk = { version = "1.5.23", features = ["enable-glwindow", "use-wayland"] }
gl = "0.14.0"
libloading = "0.8"
log = "0.4.34"
png = "0.18.1"
ringbuf = "0.5.3"

[features]
# 默认用 cpal 原生 PipeWire 后端（Linux 上 cpal::default_host 会优先选它）：
# 直接和 PipeWire 通信，不受 PipeWire-ALSA 插件「固定 2×period」小缓冲的限制，
# 也没有其「未锁采样率就上报周期范围」导致的假范围问题。
# 没有 libpipewire-0.3 开发包的系统可 `--no-default-features` 回退到 ALSA 后端。
default = ["pipewire"]
pipewire = ["cpal/pipewire"]

[lints.rust]
# edition 2024 默认已 warn；显式写出来，便于未来升级为 deny
unsafe_op_in_unsafe_fn = "warn"

[profile.dev]
# 开发时也让本 crate 的代码有基本优化，否则播放路径（YUV→RGB、重采样）
# 在 debug 下慢到掩盖真实性能问题。
# 注意：Cargo 的 profile 设置同样作用于依赖（实测依赖也被编成 opt-level=1）。
# 若想让依赖保持 opt-level=0 以缩短依赖编译，可另加：
#   [profile.dev.package."*"]
#   opt-level = 0
opt-level = 1
# 行号表即可定位 panic，完整 debuginfo 会显著拖慢编译且占大量磁盘
debug = "line-tables-only"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
